<!doctype html><meta charset="utf-8"><body>
<script type="module">
import { ITEMS } from '../js/catalog-data.js';
import { byKind, drawItem2D } from '../js/catalog.js';
import { icon } from '../js/icons.js';
const cv = document.createElement('canvas'); cv.width = 200; cv.height = 150;
const ctx = cv.getContext('2d');
const out = {};
for (const key of Object.keys(ITEMS)) {
  const def = byKind(key);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 200, 150);
  const k = Math.min(184 / def.w, 134 / def.d, 6);
  ctx.save(); ctx.translate(100, 75); ctx.scale(k, k);
  ctx.lineWidth = 1.3 / k; ctx.fillStyle = def.color; ctx.strokeStyle = '#333';
  try { drawItem2D(ctx, { kind: key, w: def.w, d: def.d, h: def.h, x: 0, y: 0 }); } catch (e) {}
  ctx.restore();
  out[key] = cv.toDataURL('image/png');
}
window.__items = out;
window.__icons = {};
window.__iconSvg = (name) => icon(name);
window.__done = true;
</script>
