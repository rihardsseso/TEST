name: Būvplāns

on:
  push:
    paths:
      - "buvplans/**"
      - ".github/workflows/buvplans.yml"
  pull_request:
    paths:
      - "buvplans/**"
      - ".github/workflows/buvplans.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: node --test buvplans/tests/*.test.mjs
