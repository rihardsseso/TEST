name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk BalssVadiba.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BalssVadiba-apk
          path: BalssVadiba.apk

      - name: Publish as release "latest"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BalssVadiba.apk \
            --target "$GITHUB_SHA" \
            --title "Balss vadība (jaunākā versija)" \
            --notes "Lejupielādē BalssVadiba.apk telefonā un atver to, lai instalētu. Uzbūvēts no ${GITHUB_REF_NAME} (${GITHUB_SHA::7})." \
            --latest
